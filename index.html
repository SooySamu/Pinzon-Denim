<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinzón | Lujo Accesible & Confección Ética</title>
  <!-- Estilos Locales -->
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <!-- 1. ENCABEZADO -->
  <div id="header-root"></div>

  <!-- 2. SECCIÓN HERO -->
  <section class="hero-section">
    <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=1600&auto=format&fit=crop"
      alt="Pinzón Denim Collection" class="hero-bg-img">
    <div class="hero-content">
      <p class="hero-tag">Nueva Colección Cápsula</p>
      <h1 class="hero-title">LUJO ACCESIBLE & CONFECCIÓN ÉTICA</h1>
      <a href="catalogo.html?categoria=todos" class="btn-primary">Comprar</a>
    </div>
  </section>

  <!-- 3. CUADRÍCULA DE CATEGORÍAS -->
  <section id="categorias" class="categories-section">
    <h2 class="categories-title">Explorar Categorías</h2>

    <div class="categories-grid">

      <div class="category-card">
        <a href="catalogo.html?categoria=todos" class="category-card" style="display: block; text-decoration: none;">
          <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600&auto=format&fit=crop"
            alt="Ver Todo">
          <div class="category-overlay">
            <span class="category-name">VER TODO</span>
          </div>
        </a>
      </div>

      <a href="catalogo.html?categoria=new" class="category-card" style="display: block; text-decoration: none;">
      <img src="https://images.unsplash.com/photo-1582552938357-32b906df40cb?q=80&w=600&auto=format&fit=crop" alt="New">
      <div class="category-overlay">
        <span class="category-name">NEW</span>
      </div>
    </a>

      <a href="catalogo.html?categoria=jeans" class="category-card" style="display: block; text-decoration: none;">
      <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=600&auto=format&fit=crop" alt="Jeans">
      <div class="category-overlay">
        <span class="category-name">JEANS</span>
      </div>
    </a>

    <a href="catalogo.html?categoria=enterizos" class="category-card" style="display: block; text-decoration: none;">
      <img src="https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=600&auto=format&fit=crop" alt="Enterizos">
      <div class="category-overlay">
        <span class="category-name">ENTERIZOS</span>
      </div>
    </a>

    <a href="catalogo.html?categoria=shorts" class="category-card" style="display: block; text-decoration: none;">
      <img src="https://images.unsplash.com/photo-1591195853828-11db59a44f6b?q=80&w=600&auto=format&fit=crop" alt="Shorts">
      <div class="category-overlay">
        <span class="category-name">SHORTS</span>
      </div>
    </a>

    <a href="catalogo.html?categoria=faldas" class="category-card" style="display: block; text-decoration: none;">
      <img src="https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?q=80&w=600&auto=format&fit=crop" alt="Faldas">
      <div class="category-overlay">
        <span class="category-name">FALDAS</span>
      </div>
    </a>

    <a href="catalogo.html?categoria=bermudas" class="category-card" style="display: block; text-decoration: none;">
      <img src="https://images.unsplash.com/photo-1565084888279-aca607ecce0c?q=80&w=600&auto=format&fit=crop" alt="Bermudas">
      <div class="category-overlay">
        <span class="category-name">BERMUDAS</span>
      </div>
    </a>

    <a href="catalogo.html?categoria=tops" class="category-card" style="display: block; text-decoration: none;">
      <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?q=80&w=600&auto=format&fit=crop" alt="Tops">
      <div class="category-overlay">
        <span class="category-name">TOPS</span>
      </div>
    </a>

  </div>
</section>

  <!-- 4. CARRITO LATERAL (SLIDE-OVER) -->
  <!-- 4. CARRITO LATERAL (SLIDE-OVER) -->
  <div id="cartModal" class="cart-modal">
    <div id="cartBackdrop" class="cart-backdrop"></div>
    <div id="cartPanel" class="cart-panel">
      <div>
        <div class="cart-header">
          <h3 class="font-serif-custom" style="font-size: 1.25rem; font-weight: 700;">Tu Carrito</h3>
          <button id="closeCart" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <!-- Contenedor dinámico -->
        <div id="cartItemsList" style="padding: 1rem 0; overflow-y: auto; max-height: 60vh;"></div>
      </div>
      <div style="border-top: 1px solid #e5e7eb; padding-top: 1rem;">
        <div style="display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 1rem;">
          <span>Total:</span>
          <span id="cartTotalDisplay">$0 COP</span>
        </div>
        <!-- Botón enviar pedido -->
        <button onclick="sendOrderToWhatsApp()" class="btn-whatsapp" style="width: 100%; border: none; cursor: pointer;">
          <i class="fa-brands fa-whatsapp"></i> Hacer Pedido
        </button>
      </div>
    </div>
  </div>

  <!-- 5. PIE DE PÁGINA (FOOTER) -->
<div id="footer-root"></div>
<div id="cart-root"></div>

  <!-- SCRIPT INTERACTIVO -->
  <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Pinzón Denim</title>
  <!-- Estilos Locales -->
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Estilos específicos para la tienda y filtros */
    .filter-btn {
      padding: 0.5rem 1.25rem;
      border: 1px solid #e5e7eb;
      background-color: #ffffff;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background-color: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 2rem;
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .product-card {
      border: 1px solid #f3f4f6;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
    }

    .product-img {
      width: 100%;
      height: 340px;
      object-fit: cover;
    }

    .product-info {
      padding: 1.25rem;
    }

    .product-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .product-tag {
      font-size: 0.75rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      display: block;
    }

    .product-price {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 1rem;
      display: block;
    }
  </style>
</head>

<body>

  <!-- 1. ENCABEZADO MINIMALISTA -->
  <div id="header-root"></div>

  <!-- 2. TÍTULO Y BOTONES DE FILTRO -->
  <section class="categories-section" style="padding-bottom: 2rem;">
    <h1 class="categories-title" id="catalogTitle" style="font-size: 2.5rem; text-align: center; margin-bottom: 2rem;">
      Colección Denim Pinzón</h1>

    <!-- Barra de Filtros interactivos -->
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 3rem;">
      <button class="filter-btn active" onclick="applyFilter('todos', this)">Ver Todo</button>
      <button class="filter-btn" onclick="applyFilter('new', this)">NEW</button>
      <button class="filter-btn" onclick="applyFilter('hombre', this)">Hombre</button>
      <button class="filter-btn" onclick="applyFilter('mujer', this)">Mujer</button>
      <button class="filter-btn" onclick="applyFilter('nino', this)">Niño</button>
      <button class="filter-btn" onclick="applyFilter('jeans', this)">Jeans</button>
      <button class="filter-btn" onclick="applyFilter('faldas', this)">Faldas</button>
      <button class="filter-btn" onclick="applyFilter('shorts', this)">Shorts</button>
      <button class="filter-btn" onclick="applyFilter('enterizos', this)">Enterizos</button>
      <button class="filter-btn" onclick="applyFilter('bermudas', this)">Bermudas</button>
      <button class="filter-btn" onclick="applyFilter('tops', this)">Tops</button>
    </div>

    <!-- 3. CUADRÍCULA DE PRODUCTOS -->
    <div class="product-grid" id="productGrid">

    </div>
  </section>

  <!-- 4. CARRITO LATERAL (SLIDE-OVER) -->
  <div id="cartModal" class="cart-modal">
    <div id="cartBackdrop" class="cart-backdrop"></div>
    <div id="cartPanel" class="cart-panel">
      <div>
        <div class="cart-header">
          <h3 class="font-serif-custom" style="font-size: 1.25rem; font-weight: 700;">Tu Carrito</h3>
          <button id="closeCart" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <!-- AQUÍ SE INSERTARÁN LOS PRODUCTOS DINÁMICAMENTE -->
        <div id="cartItemsList" style="padding: 1rem 0; overflow-y: auto; max-height: 60vh;">
          <p style="text-align: center; color: #6b7280; margin-top: 2rem;">Tu carrito está vacío.</p>
        </div>
      </div>
      <div style="border-top: 1px solid #e5e7eb; padding-top: 1rem;">
        <div style="display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 1rem;">
          <span>Total:</span>
          <span id="cartTotalDisplay">$0 COP</span>
        </div>
        <!-- BOTÓN FINAL PARA ENVIAR PEDIDO -->
        <button onclick="sendOrderToWhatsApp()" class="btn-whatsapp"
          style="width: 100%; border: none; cursor: pointer;">
          <i class="fa-brands fa-whatsapp"></i> Hacer Pedido
        </button>
      </div>
    </div>
  </div>

  <!-- 5. PIE DE PÁGINA (FOOTER) -->
  <div id="footer-root"></div>
  <div id="cart-root"></div>

  <!-- SCRIPT DE CARRITO, BÚSQUEDA Y FILTROS -->
<script src="script.js"></script>
</body>

</html>
